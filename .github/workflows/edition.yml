name: Edition

# Hourly from 05:00 to 23:00 WAT (WAT = UTC+1), spec 4.1. A failed run emails the repo owner
# through GitHub's default notifications; the site keeps serving the last good edition.
on:
  schedule:
    - cron: '0 4-22 * * *'
  workflow_dispatch:

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pipeline
        run: pnpm pipeline:run
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ENABLE_PHOTOS: 'true'
          REVALIDATE_URL: ${{ vars.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
